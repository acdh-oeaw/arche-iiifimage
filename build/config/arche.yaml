dissCacheService:
  db: sqlite:/var/www/html/db_image.sqlite
  dbId: image
  log:
    file: /var/www/html/log
    level: debug
  ttl:
    resource: 3600     # 1 hour
    response: 31536000 # 1 year
  maxCount: 100000
  repoDb:
  - archeProd.yaml
  - archeCur.yaml
  allowedNmsp:
  - https://id.acdh.oeaw.ac.at/
  - https://arche.acdh.oeaw.ac.at/api/
  - https://arche-curation.acdh-dev.oeaw.ac.at/api/
  - https://arche-dev.acdh-dev.oeaw.ac.at/api/
  - https://hdl.handle.net/
  metadataMode: 0_0_1_0
  parentProperty: ~
  resourceProperties:
  - https://vocabs.acdh.oeaw.ac.at/schema#hasIdentifier
  - https://vocabs.acdh.oeaw.ac.at/schema#hasTitle
  - https://vocabs.acdh.oeaw.ac.at/schema#hasPixelWidth
  - https://vocabs.acdh.oeaw.ac.at/schema#hasPixelHeight
  - https://vocabs.acdh.oeaw.ac.at/schema#hasLicense
  - https://vocabs.acdh.oeaw.ac.at/schema#hasFormat
  - https://vocabs.acdh.oeaw.ac.at/schema#hasRawBinarySize
  - https://vocabs.acdh.oeaw.ac.at/schema#hasHash
  - https://vocabs.acdh.oeaw.ac.at/schema#isPartOf
  - https://vocabs.acdh.oeaw.ac.at/schema#aclRead
  relativesProperties:
  - https://vocabs.acdh.oeaw.ac.at/schema#hasIdentifier
  - https://vocabs.acdh.oeaw.ac.at/schema#hasTitle
iiifImage:
  baseUrl: https://arche-iiifimage.acdh.oeaw.ac.at/
  basePath: /
  maxWidth: 5000
  maxHeight: 5000
  maxArea: 25000000
  backendConfig: ~
  info:
    idRegex: "`^https://id.acdh.oeaw.ac.at/`"
    rightsRegex: "`^(?!https://arche|https://id.acdh.oeaw.ac.at/|https://vocabs.acdh.oeaw.ac.at/)`"
  unauthorizedImageUri: https://id.acdh.oeaw.ac.at/dissemination/loris/unauthorizedImage.png
fileCache:
  dir: cache
  maxSizeMb: 1000
  clearMode: time
  maxDownloadSizeMb: 100
  mimeProperty: https://vocabs.acdh.oeaw.ac.at/schema#hasFormat
  localAccess:
    https://arche.acdh.oeaw.ac.at/api/:
      level: 2
      dir: /arche
auth:
  aclReadProperty: https://vocabs.acdh.oeaw.ac.at/schema#aclRead
  publicRole: public
  academicRole: academic
  roleTrustedHeader: academic
  adminRole: admin
  ttl: 300
  # see https://www.php.net/manual/en/function.password-hash.php
  passwordCost: 10
  passBasicAuth: false
  defaultAuth: ['', '']
schema:
  width: https://vocabs.acdh.oeaw.ac.at/schema#hasPixelWidth
  height: https://vocabs.acdh.oeaw.ac.at/schema#hasPixelHeight
  license: https://vocabs.acdh.oeaw.ac.at/schema#hasLicense
  parent: https://vocabs.acdh.oeaw.ac.at/schema#isPartOf
  mime: https://vocabs.acdh.oeaw.ac.at/schema#hasFormat
  size: https://vocabs.acdh.oeaw.ac.at/schema#hasRawBinarySize
  hash: https://vocabs.acdh.oeaw.ac.at/schema#hasHash
  previousHash: __previous_hash__
  iiifInfo: __info__
